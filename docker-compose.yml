services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentmatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentmatch}
      POSTGRES_DB: ${POSTGRES_DB:-talentmatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentmatch} -d ${POSTGRES_DB:-talentmatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - talentmatch-network

  # "minio/minio" n'est plus distribué sur Docker Hub : on utilise RustFS (compatible S3),
  # avec les mêmes ports et les mêmes variables MINIO_* dans le .env.
  minio:
    image: rustfs/rustfs:latest
    container_name: talentmatch-minio
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health/ready && curl --fail http://127.0.0.1:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - talentmatch-network


  mailpit:
    image: axllent/mailpit:latest
    container_name: talentmatch-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - talentmatch-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentmatch-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # Dans le réseau Docker, on utilise le nom des services (et non localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-talentmatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-talentmatch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-talentmatch}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      # Clé de signature des jetons JWT (au moins 32 caractères, à définir dans .env)
      JWT_SECRET: ${JWT_SECRET}
      # IA : Gemini via Google AI Studio (clé API à mettre dans .env)
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GEMINI_API_KEY}
      SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Propriétés applicatives (à adapter au prefix réel de ton @ConfigurationProperties)
      TALENTMATCH_STORAGE_MINIO_ENDPOINT: http://minio:9000
      TALENTMATCH_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      TALENTMATCH_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${BACKEND_PORT:-8000}:8080"
    networks:
      - talentmatch-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentmatch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - talentmatch-network

volumes:
  postgres_data:
  minio_data:

networks:
  talentmatch-network:
    driver: bridge